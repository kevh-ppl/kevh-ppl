<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <style>
    .spin { transform-origin: 110px 140px; animation: spin 2.5s linear infinite; }
    @keyframes spin {
      0%   { transform: scaleX(1); }
      25%  { transform: scaleX(0.05); }
      50%  { transform: scaleX(-1); }
      75%  { transform: scaleX(0.05); }
      100% { transform: scaleX(1); }
    }
  </style>
  <g class="spin" stroke="#000" stroke-width="2" stroke-linejoin="round">
    <!-- aleta izquierda -->
    <path d="M62 130 Q30 170 42 205 Q60 190 70 160 Z" fill="#1a1a1a"/>
    <!-- aleta derecha saludando -->
    <path d="M150 128 Q178 105 196 70 Q206 66 204 80 Q192 120 160 152 Z" fill="#1a1a1a"/>
    <!-- cuerpo -->
    <ellipse cx="110" cy="145" rx="55" ry="85" fill="#1a1a1a"/>
    <!-- panza -->
    <ellipse cx="110" cy="168" rx="40" ry="58" fill="#f4f4f4"/>
    <!-- ojos felices -->
    <path d="M86 98 Q96 84 106 98" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M114 98 Q124 84 134 98" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- cachetes -->
    <ellipse cx="80" cy="112" rx="8" ry="5" fill="#ff8fa3" stroke="none" opacity="0.8"/>
    <ellipse cx="140" cy="112" rx="8" ry="5" fill="#ff8fa3" stroke="none" opacity="0.8"/>
    <!-- pico sonriente -->
    <path d="M94 108 Q110 100 126 108 Q122 124 110 126 Q98 124 94 108 Z" fill="#f7b500"/>
    <path d="M96 112 Q110 122 124 112" fill="none" stroke="#c78900" stroke-width="1.5"/>
    <!-- patas -->
    <path d="M70 225 Q60 240 82 244 Q100 246 104 230 Z" fill="#f7b500"/>
    <path d="M150 225 Q160 240 138 244 Q120 246 116 230 Z" fill="#f7b500"/>
  </g>
</svg>
